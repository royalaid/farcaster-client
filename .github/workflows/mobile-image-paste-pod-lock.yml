name: Mobile image paste Podfile lock candidate

on:
  push:
    branches:
      - fix/mobile-image-clipboard-paste

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-podfile-lock:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EVIDENCE_SUBDIR: mobile-image-paste-pod-lock
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preserve committed lock baseline
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          mkdir -p "$EVIDENCE_DIR"
          cp apps/farcaster-mobile/ios/Podfile.lock "$EVIDENCE_DIR/Podfile.lock.baseline"

      - name: Set up Node.js 24.3.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0

      - name: Enable pnpm 10.8.1
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods 1.16.2
        run: |
          GEM_BIN="$(ruby -r rubygems -e 'puts Gem.user_dir')/bin"
          gem install --user-install cocoapods -v 1.16.2 --no-document
          echo "$GEM_BIN" >> "$GITHUB_PATH"
          export PATH="$GEM_BIN:$PATH"
          test "$(pod --version)" = "1.16.2"

      - name: Record tool versions
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          {
            node --version
            pnpm --version
            pod --version
            xcodebuild -version
          } > "$EVIDENCE_DIR/versions.txt" 2>&1
          cat "$EVIDENCE_DIR/versions.txt"

      - name: Generate Podfile.lock candidate
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          set +e
          cd apps/farcaster-mobile/ios
          RCT_NEW_ARCH_ENABLED=1 pod update react-native-paste-input --no-repo-update \
            2>&1 | tee "$EVIDENCE_DIR/cocoapods.log"
          pod_status=${PIPESTATUS[0]}
          printf '%s\n' "$pod_status" > "$EVIDENCE_DIR/cocoapods-exit-status.txt"
          exit 0

      - name: Collect result evidence
        if: always()
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          mkdir -p "$EVIDENCE_DIR"
          lock=apps/farcaster-mobile/ios/Podfile.lock
          if [[ -f "$lock" ]]; then
            cp "$lock" "$EVIDENCE_DIR/Podfile.lock.generated"
          fi
          git diff -- "$lock" > "$EVIDENCE_DIR/Podfile.lock.diff"
          git diff --numstat -- "$lock" > "$EVIDENCE_DIR/Podfile.lock.numstat"
          : > "$EVIDENCE_DIR/sha256.txt"
          if [[ -f "$EVIDENCE_DIR/Podfile.lock.baseline" ]]; then
            shasum -a 256 "$EVIDENCE_DIR/Podfile.lock.baseline" >> "$EVIDENCE_DIR/sha256.txt"
          fi
          if [[ -f "$EVIDENCE_DIR/Podfile.lock.generated" ]]; then
            shasum -a 256 "$EVIDENCE_DIR/Podfile.lock.generated" >> "$EVIDENCE_DIR/sha256.txt"
          fi

      - name: Upload Podfile.lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-image-paste-pod-lock-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-image-paste-pod-lock
          if-no-files-found: error
          retention-days: 7

      - name: Enforce successful generation
        if: always()
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          status_file="$EVIDENCE_DIR/cocoapods-exit-status.txt"
          generated_lock="$EVIDENCE_DIR/Podfile.lock.generated"
          if [[ ! -f "$status_file" ]]; then
            echo "CocoaPods did not run or did not record an exit status." >&2
            exit 1
          fi
          status="$(tr -d '[:space:]' < "$status_file")"
          if [[ ! "$status" =~ ^[0-9]+$ ]] || [[ "$status" -ne 0 ]]; then
            echo "CocoaPods failed with status: $status" >&2
            exit 1
          fi
          if [[ ! -f "$generated_lock" ]]; then
            echo "CocoaPods produced no Podfile.lock result." >&2
            exit 1
          fi
